substitutions:
  # Choisissez la langue : "FR", "EN", "ES", "DE", "IT"
  lang: "FR"
  weather_entity: "weather.forecast_maison"

esphome:
  name: station-meteo-epaper
  friendly_name: "Station Météo e-Paper"
  on_boot:
    priority: 900
    then:
      - lambda: |-
          // 1. Préparer le niveau HAUT sur GPIO17 AVANT de libérer le verrouillage
          gpio_set_direction(GPIO_NUM_17, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_17, 1);
          gpio_hold_dis(GPIO_NUM_17);
          gpio_hold_dis(GPIO_NUM_6);
          gpio_deep_sleep_hold_dis();
      # Sécurité : mise en veille après 20s si le Wi-Fi ou HA ne répond pas
      - delay: 20s
      - script.execute: aller_dormir

# --- ALIMENTATION PRIORITAIRE V2 (AVANT SETUP) ---
power_supply:
  - id: epd_power_enable
    pin:
      number: GPIO6
      inverted: true
    enable_on_boot: true
    keep_on_time: 0s

  - id: v2_periph_power
    pin:
      number: GPIO42
      inverted: true
    enable_on_boot: true
    keep_on_time: 0s

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  on_client_connected:
    - delay: 4s
    - component.update: epaper_display
    - delay: 3s
    - script.execute: aller_dormir

ota:
  - platform: esphome

safe_mode:
  boot_is_good_after: 5s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT
  manual_ip:
    static_ip: 192.168.0.56
    gateway: 192.168.0.254
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 8.8.4.4

# --- GESTION DU DEEP SLEEP ---
# Réglé sur 1min pour valider le réveil sans USB (repasser à 60min ensuite)
deep_sleep:
  id: deep_sleep_control
  # sleep_duration: 1min
  sleep_duration: 60min
  wakeup_pin:
    number: GPIO18
    inverted: true
    mode:
      input: true
      pullup: true

switch:
  - platform: template
    name: "Bloquer Deep Sleep (Mode OTA)"
    id: prevent_deep_sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

script:
  - id: aller_dormir
    then:
      - if:
          condition:
            switch.is_off: prevent_deep_sleep
          then:
            - lambda: |-
                // 2. Fixer les niveaux AVANT d'activer le verrouillage de veille
                gpio_set_direction(GPIO_NUM_17, GPIO_MODE_OUTPUT);
                gpio_set_level(GPIO_NUM_17, 1);
                gpio_set_direction(GPIO_NUM_6, GPIO_MODE_OUTPUT);
                gpio_set_level(GPIO_NUM_6, 1);
                gpio_hold_en(GPIO_NUM_17);
                gpio_hold_en(GPIO_NUM_6);
                gpio_deep_sleep_hold_en();
            - deep_sleep.enter: deep_sleep_control

# --- HEURE VIA HOME ASSISTANT ---
time:
  - platform: homeassistant
    id: ha_time

# --- BUS SPI & I2C ---
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO13
  id: spi_epaper

i2c:
  sda: GPIO47
  scl: GPIO48
  id: bus_a

# --- POLICES & ICÔNES ---
font:
  - file: "gfonts://Roboto@700"
    id: font_heure
    size: 30
    glyphs: "0123456789:"

  - file: "gfonts://Roboto@500"
    id: font_titre
    size: 13
    glyphs: "ADEGINORSTUWXÉ"

  - file: "gfonts://Roboto@700"
    id: font_temp_big
    size: 30
    glyphs: "0123456789.-°%"

  - file: "gfonts://Roboto@500"
    id: font_minmax
    size: 12
    glyphs: "0123456789-°/Minax "

  - file: "gfonts://Roboto@400"
    id: font_small
    size: 13
    glyphs: "0123456789.%-°"

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_weather_icons
    size: 48
    glyphs:
      - "\U000F0599" # sunny
      - "\U000F0595" # partlycloudy
      - "\U000F0590" # cloudy
      - "\U000F0597" # rainy
      - "\U000F0596" # pouring
      - "\U000F0593" # lightning-rainy
      - "\U000F0598" # snowy
      - "\U000F0591" # fog
      - "\U000F0594" # clear-night

# --- DONNÉES DE HOME ASSISTANT ---
text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}

sensor:
  - platform: homeassistant
    id: outdoor_temp
    entity_id: ${weather_entity}
    attribute: temperature

  - platform: homeassistant
    id: outdoor_temp_max
    entity_id: sensor.meteo_max_aujourd_hui

  - platform: homeassistant
    id: outdoor_temp_min
    entity_id: sensor.meteo_min_aujourd_hui

  - platform: shtcx
    i2c_id: bus_a
    address: 0x70
    temperature:
      name: "Température Intérieure"
      id: indoor_temp
    humidity:
      name: "Humidité Intérieure"
      id: indoor_hum
    update_interval: 5s

  - platform: adc
    pin: GPIO4
    name: "Batterie"
    id: battery_voltage
    unit_of_measurement: "%"
    device_class: battery
    attenuation: 12db
    update_interval: 5s
    filters:
      - multiply: 2.0
      - calibrate_linear:
          - 3.2 -> 0.0
          - 4.2 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

# --- MISE EN PAGE GRAPHIQUE (200x200 px) ---
display:
  - platform: waveshare_epaper
    id: epaper_display
    spi_id: spi_epaper
    cs_pin: GPIO11
    dc_pin: GPIO10
    busy_pin:
      number: GPIO8
      inverted: false
    reset_pin: GPIO9
    model: 1.54inv2
    full_update_every: 1
    reset_duration: 2ms
    update_interval: never
    lambda: |-
      it.fill(COLOR_OFF);

      const std::string lang = "${lang}";
      const char* lbl_ext = "EXTÉRIEUR";
      const char* lbl_int = "INTÉRIEUR";
      const char* lbl_min = "Min";
      const char* lbl_max = "Max";

      if (lang == "EN") {
        lbl_ext = "OUTDOOR";
        lbl_int = "INDOOR";
      } else if (lang == "ES") {
        lbl_ext = "EXTERIOR";
        lbl_int = "INTERIOR";
      } else if (lang == "DE") {
        lbl_ext = "AUSSEN";
        lbl_int = "INNEN";
      } else if (lang == "IT") {
        lbl_ext = "ESTERNO";
        lbl_int = "INTERNO";
      }

      // 1. BANDEAU SUPÉRIEUR : HEURE, BATTERIE & PRÉVISIONS
      if (id(ha_time).now().is_valid()) {
        it.strftime(6, 6, id(font_heure), "%H:%M", id(ha_time).now());
      }
      if (id(battery_voltage).has_state()) {
        it.printf(194, 6, id(font_small), TextAlign::TOP_RIGHT, "%.0f%%", id(battery_voltage).state);
      }
      if (id(outdoor_temp_min).has_state() && id(outdoor_temp_max).has_state()) {
        it.printf(194, 28, id(font_minmax), TextAlign::TOP_RIGHT, "%s %.0f° / %s %.0f°",
                  lbl_min, id(outdoor_temp_min).state, lbl_max, id(outdoor_temp_max).state);
      }
      it.line(6, 54, 194, 54);

      // 2. ZONE CENTRALE : MÉTÉO EXTÉRIEURE
      it.printf(6, 60, id(font_titre), "%s", lbl_ext);

      std::string cond = id(weather_condition).state;
      const char* icon = "\U000F0590";
      if (cond == "sunny") icon = "\U000F0599";
      else if (cond == "clear-night") icon = "\U000F0594";
      else if (cond == "partlycloudy") icon = "\U000F0595";
      else if (cond == "rainy") icon = "\U000F0597";
      else if (cond == "pouring") icon = "\U000F0596";
      else if (cond == "lightning" || cond == "lightning-rainy") icon = "\U000F0593";
      else if (cond == "snowy" || cond == "snowy-rainy") icon = "\U000F0598";
      else if (cond == "fog") icon = "\U000F0591";

      it.printf(12, 76, id(font_weather_icons), "%s", icon);

      if (id(outdoor_temp).has_state()) {
        it.printf(194, 78, id(font_temp_big), TextAlign::TOP_RIGHT, "%.1f°", id(outdoor_temp).state);
      }
      it.line(6, 130, 194, 130);

      // 3. ZONE INFÉRIEURE : CAPTEUR INTÉRIEUR
      it.printf(6, 136, id(font_titre), "%s", lbl_int);
      if (id(indoor_temp).has_state()) {
        it.printf(6, 154, id(font_temp_big), "%.1f°", id(indoor_temp).state);
      }
      if (id(indoor_hum).has_state()) {
        it.printf(194, 154, id(font_temp_big), TextAlign::TOP_RIGHT, "%.0f%%", id(indoor_hum).state);
      }
