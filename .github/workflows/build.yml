name: Build ESPHome Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Validate & Compile ESPHome
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup secrets from example
        run: |
          if [ -f secrets.yaml.example ]; then
            cp secrets.yaml.example secrets.yaml
          else
            printf 'wifi_ssid: "TestSSID"\nwifi_password: "TestPassword"\n' > secrets.yaml
          fi

      - name: Compile ESPHome configuration
        uses: esphome/build-action@v1
        with:
          yaml_file: station-meteo-epaper.yaml
